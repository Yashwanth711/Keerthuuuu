<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Letter 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Envelope / Cat / Existing letter animations -->
  <div id="envelopeContainer">
    <img id="envelope" src="envelope.png" alt="Envelope">
    <img id="cat" src="cat.png" alt="Cat" class="hidden">
  </div>

  <!-- Letter Content (hidden initially) -->
  <div id="letter" class="hidden">
    <h2>Will you say YES? 💖</h2>

    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <!-- Final text that appears after YES -->
    <p id="final-text" class="final-text" style="display: none">
      <strong>Valentine Date:</strong> Monarch Restaurant at 7PM
    </p>
  </div>

  <!-- Crying Popup (small, NOT fullscreen) -->
  <div id="cryingPopup" class="popup">
    <p id="cryText">WHY 😭</p>
    <img id="cryingImg" src="crying1.png" alt="Crying">
  </div>

  <script src="script.js"></script>
</body>
</html>
