<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Letter 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background -->
  <img src="heart-bg.jpg" class="bg" alt="Heart Background">

  <!-- Envelope container -->
  <div id="envelopeContainer">
    <img id="envelope" src="envelope.png" alt="Envelope">
  </div>

  <!-- Window frame (hidden at start) -->
  <img id="windowFrame" src="window.png" class="hidden" alt="Window Frame">

  <!-- Cat image -->
  <img id="cat" src="cat_heart.gif" class="hidden" alt="Cat">

  <!-- Letter content -->
  <div id="letter" class="hidden">
    <h2>Will you say YES? 💖</h2>

    <div class="buttons">
      <img id="yes" src="yes.png" alt="Yes">
      <img id="no" src="no.png" alt="No">
    </div>

    <p id="final-text" class="final-text" style="display: none">
      <strong>Valentine Date:</strong> Monarch Restaurant at 7PM
    </p>
  </div>

  <!-- Crying popup -->
  <div id="cryingPopup" class="popup">
    <p id="cryText">WHY 😭</p>
    <img id="cryingImg" src="crying1.png" alt="Crying">
  </div>

  <script src="script.js"></script>
</body>
</html>
